name: StudyCraft
options:
  bundleIdPrefix: app.studycraft
  developmentLanguage: de
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
targets:
  StudyCraft:
    type: application
    platform: iOS
    sources:
      - Sources/StudyCraft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.studycraft.StudyCraft
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: StudyCraft
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        # Der Lernordner wird in Dateien/iCloud Drive gewählt; die Dateien sind auch dort sichtbar.
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
  StudyCraftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/StudyCraftTests
    dependencies:
      - target: StudyCraft
schemes:
  StudyCraft:
    build:
      targets:
        StudyCraft: all
        StudyCraftTests: [test]
    test:
      targets: [StudyCraftTests]
